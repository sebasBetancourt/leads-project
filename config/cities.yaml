# Ciudades de Colombia por prioridad (1 = primero). discovery recorre por prioridad
# y, dentro de cada una, por sector. Desactiva una ciudad con enabled: false.
#
# Arranque: solo Santander. El resto del país queda listo; actívalo cambiando enabled a true.

cities:
  # --- Santander: área metropolitana de Bucaramanga ---
  - { name: Bucaramanga,     department: Santander,          priority: 1, enabled: true }
  - { name: Floridablanca,   department: Santander,          priority: 1, enabled: true }
  - { name: Girón,           department: Santander,          priority: 1, enabled: true }
  - { name: Piedecuesta,     department: Santander,          priority: 1, enabled: true }
  # --- Santander: resto del departamento ---
  - { name: Barrancabermeja, department: Santander,          priority: 2, enabled: true }
  - { name: San Gil,         department: Santander,          priority: 2, enabled: true }
  - { name: Socorro,         department: Santander,          priority: 2, enabled: true }

  # --- Resto de Colombia (después de Santander) ---
  - { name: Bogotá,        department: Cundinamarca,       priority: 3, enabled: false }
  - { name: Medellín,      department: Antioquia,          priority: 3, enabled: false }
  - { name: Cali,          department: Valle del Cauca,    priority: 3, enabled: false }
  - { name: Barranquilla,  department: Atlántico,          priority: 3, enabled: false }
  - { name: Cúcuta,        department: Norte de Santander, priority: 3, enabled: false }
  - { name: Cartagena,     department: Bolívar,            priority: 4, enabled: false }
  - { name: Pereira,       department: Risaralda,          priority: 4, enabled: false }
  - { name: Manizales,     department: Caldas,             priority: 4, enabled: false }
  - { name: Ibagué,        department: Tolima,             priority: 5, enabled: false }
  - { name: Villavicencio, department: Meta,               priority: 5, enabled: false }
  - { name: Santa Marta,   department: Magdalena,          priority: 5, enabled: false }
  - { name: Armenia,       department: Quindío,            priority: 5, enabled: false }
  - { name: Pasto,         department: Nariño,             priority: 5, enabled: false }
  - { name: Neiva,         department: Huila,              priority: 5, enabled: false }
  - { name: Montería,      department: Córdoba,            priority: 5, enabled: false }
  - { name: Popayán,       department: Cauca,              priority: 5, enabled: false }
  - { name: Tunja,         department: Boyacá,             priority: 5, enabled: false }
