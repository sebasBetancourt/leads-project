services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # solo tu máquina; cambia el puerto si ya tienes otro Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Scraper de Google Maps (github.com/gosom/google-maps-scraper, MIT).
  # Lo usamos tal cual por su REST API: POST /api/v1/jobs. Docs en http://localhost:8080/api/docs
  gmaps:
    image: gosom/google-maps-scraper:v1.18.1
    restart: unless-stopped
    command: ["-data-folder", "/gmapsdata"]
    ports:
      - "127.0.0.1:8080:8080"  # la API de gosom no tiene autenticación: solo tu máquina
    volumes:
      - ./gmapsdata:/gmapsdata
      - gmaps-playwright-cache:/opt

  # Scheduler: discovery, enrichment, agente, sync con Sheets, envío de email, respuestas y seguimientos.
  # Las redes (WhatsApp, Instagram, Facebook, LinkedIn) son asistidas: no se envía nada desde aquí (docs/adr/0005).
  # Una sola instancia (ADR 0003): no escales este servicio.
  worker:
    build: .
    restart: unless-stopped
    command: ["leadbot", "worker"]
    # Falla si el worker dejó de dar señales (jobs/heartbeat.py). Mira el estado con `docker compose ps`.
    healthcheck:
      test: ["CMD", "leadbot", "worker-health"]
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 3m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GMAPS_SCRAPER_URL: http://gmaps:8080
    volumes:
      - ./config:/app/config:ro
      - ./knowledge:/app/knowledge:ro
      - ./credentials:/app/credentials:ro
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      gmaps:
        condition: service_started

  # CLI de uso puntual: docker compose run --rm app leadbot discover
  app:
    build: .
    profiles: ["cli"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GMAPS_SCRAPER_URL: http://gmaps:8080
    volumes:
      - ./config:/app/config:ro
      - ./knowledge:/app/knowledge:ro
      - ./credentials:/app/credentials:ro
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy

  # Respaldo diario de la base (conserva los 7 más recientes en ./backups). Restaurar:
  #   gunzip -c backups/leadbot-AAAAMMDD-HHMM.sql.gz | docker compose exec -T postgres psql -U $POSTGRES_USER $POSTGRES_DB
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/leadbot-$$(date +%Y%m%d-%H%M).sql.gz
          if pg_dump -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "$$file"; then
            echo "respaldo listo: $$file"
          else
            echo "ERROR: el respaldo falló" >&2; rm -f "$$file"
          fi
          ls -1t /backups/leadbot-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm --
          sleep 86400
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  gmaps-playwright-cache:
